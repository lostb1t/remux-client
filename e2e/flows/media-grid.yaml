# The Media page on a TV: the remote goes down the grid of libraries, row by row, and back up.
# (The WebView's own search jumped along the first row and never reached the rows below.)
appId: com.github.remux
---
- launchApp:
    stopApp: true
- runFlow:
    file: ../lib/open-page.yaml
    env:
      PAGE: Media
- extendedWaitUntil:
    visible: Favorites
    timeout: 15000

# Down from the menu button is the first tile, and right is the second.
# The remote starts on the first tile.
- extendedWaitUntil:
    visible:
      text: Favorites
      focused: true
    timeout: 5000
- pressKey: Remote Dpad Right
- assertVisible:
    text: Playlists
    focused: true

- pressKey: Remote Dpad Down
- assertNotVisible:
    text: Playlists
    focused: true
- assertNotVisible:
    text: Favorites
    focused: true
- pressKey: Remote Dpad Up
- assertVisible:
    text: Playlists
    focused: true
# Up from the first row opens the menu, on Media.
- pressKey: Remote Dpad Up
- extendedWaitUntil:
    visible:
      text: Media
      focused: true
    timeout: 3000
- assertVisible: Settings
