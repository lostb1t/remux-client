# The menu on a TV: its places are one column, and left and right stay on them. (They went to the
# page behind the menu, which the WebView's own search found nearest.)
appId: com.github.remux
---
- launchApp:
    stopApp: true
- runFlow:
    file: ../lib/open-page.yaml
    env:
      PAGE: Media
- extendedWaitUntil:
    visible: Favorites
    timeout: 15000
# Up to the menu button, OK: the menu opens on the page it is on.
# Up from the page opens the menu, on the place shown.
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            notVisible: Settings
          commands:
            - pressKey: Remote Dpad Up
            - waitForAnimationToEnd:
                timeout: 1000
- extendedWaitUntil:
    visible:
      text: Media
      focused: true
    timeout: 5000
# Right stays in the panel, down is the next place; left stays too, and up is Media again.
- pressKey: Remote Dpad Right
- waitForAnimationToEnd:
    timeout: 1000
- pressKey: Remote Dpad Down
- extendedWaitUntil:
    visible:
      text: Discover
      focused: true
    timeout: 3000
- pressKey: Remote Dpad Left
- waitForAnimationToEnd:
    timeout: 1000
- pressKey: Remote Dpad Up
- extendedWaitUntil:
    visible:
      text: Media
      focused: true
    timeout: 3000
# Up from the first place stays on it (it does not fall back onto the menu button).
- pressKey: Remote Dpad Up
- pressKey: Remote Dpad Up
- extendedWaitUntil:
    visible:
      text: Home
      focused: true
    timeout: 3000
- assertVisible: Settings
