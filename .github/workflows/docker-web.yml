name: Docker Web

# The web app as a container image for linux/amd64 and linux/arm64, in GitHub Packages
# (ghcr.io/<this repository>). The app is built by `Build Web`; this only puts it in an image with a
# web server (docker/web.Dockerfile). Called by the nightly workflow, with the tag the image gets;
# can also be run by hand.
on:
  workflow_call:
    inputs:
      tag:
        description: The tag of the image, besides the commit's.
        type: string
        default: nightly
      image:
        description: Make the image. Without, only the app is built (for its zip).
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the image, besides the commit's.
        type: string
        default: nightly
      image:
        description: Make the image. Without, only the app is built.
        type: boolean
        default: true

jobs:
  build:
    uses: ./.github/workflows/build-web.yml

  image:
    needs: build
    if: ${{ inputs.image != false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download the app
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nothing is run while building the image (only copied), so no emulation is needed for arm64.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
