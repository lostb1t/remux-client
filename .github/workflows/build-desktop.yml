name: Build Desktop

# The macOS, Windows and Linux apps (`nsh package`), each on a runner of its own system. Other
# workflows use this one and take the `desktop-<os>` artifacts. On a Mac the video player is mpv
# (the `RemuxMpv` framework, built here and put into the app); on Linux it is mpv too, the system's
# libmpv (the `libmpv2` package), loaded as the player starts; on Windows the app plays nothing yet
# (PLAN.md).
on:
  workflow_call:
    inputs:
      only:
        description: One of macos, windows, linux (empty is all three).
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      only:
        description: One of macos, windows, linux (empty is all three).
        type: string
        default: ""

jobs:
  # The platforms to build: all three, or the one asked for.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
        run: |
          # GTK 4.14, which NSH's Linux runtime needs, is Ubuntu 24.04's.
          all='[{"os":"macos","runner":"macos-latest"},{"os":"windows","runner":"windows-latest"},{"os":"linux","runner":"ubuntu-24.04"}]'
          echo "matrix=$(jq -c --arg only "$ONLY" '[.[] | select($only == "" or .os == $only)]' <<< "$all")" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up NSH
        uses: ./.github/actions/setup-nsh
        with:
          cache-key: desktop-${{ matrix.os }}

      - name: Install GTK and GStreamer (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev clang libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # mpv (MPVKit) and the Swift around it: the macOS video player, kept between runs (its
      # source is the package and its pinned versions).
      - name: Cache the mpv framework (macOS)
        if: matrix.os == 'macos'
        id: mpv
        uses: actions/cache@v4
        with:
          path: macos/build/framework
          key: remux-mpv-${{ hashFiles('macos/RemuxMpv/**') }}

      - name: Build the mpv framework (macOS)
        if: matrix.os == 'macos' && steps.mpv.outputs.cache-hit != 'true'
        run: scripts/build-macos-framework.sh Release

      # The Linux player loads libmpv and libEGL when it starts (`src/player/mpv_linux.rs`), so the
      # build does not need them; here the functions it loads are checked against Ubuntu's.
      - name: Check the player's libmpv functions (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq libmpv2 libegl1
          lib() { ldconfig -p | awk -v name="$1" '$1 == name { print $NF; exit }'; }
          mpv=$(lib libmpv.so.2); egl=$(lib libEGL.so.1)
          test -n "$mpv" && test -n "$egl"
          missing=0
          for symbol in $(grep -o 'b"[a-zA-Z_]*\\0"' src/player/mpv_linux.rs | sed 's/^b"//; s/\\0"$//' | sort -u); do
            case "$symbol" in egl*) file=$egl ;; *) file=$mpv ;; esac
            if nm -D --defined-only "$file" | awk '{ print $NF }' | grep -qx "$symbol"; then
              echo "ok $symbol"
            else
              echo "::error::$symbol is not in $file"; missing=1
            fi
          done
          exit $missing

      - name: Build the app
        shell: bash
        run: nsh package --target ${{ matrix.os }} -o out

      - name: Put the mpv framework into the app (macOS)
        if: matrix.os == 'macos'
        run: scripts/bundle-macos-framework.sh out/Remux.app

      # One file per platform: the .app zipped (macOS), the zip and the .tar.gz nsh writes.
      - name: Collect the package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.os }}" in
            macos) ditto -c -k --sequesterRsrc --keepParent out/Remux.app dist/remux-macos.zip ;;
            windows) cp out/*.zip dist/remux-windows.zip ;;
            linux) cp out/*.tar.gz dist/remux-linux.tar.gz ;;
          esac
          ls -la dist

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
