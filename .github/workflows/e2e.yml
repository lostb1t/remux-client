name: End-to-end

# Runs the flows of e2e/ (Maestro) on Android emulators, side by side: the TV's in two halves, the
# phone's, each on a runner of its own; and beside them the web app's tests (tests/web.test.tsx,
# `nsh test --target web`) in a headless Chrome, which builds the app itself. On every push to main
# and every pull request, with the APK built here first (not in the nightly, which only builds and
# releases). The app signs in at its login page (e2e/lib/login.yaml) on the server and with the
# user of the repository's secrets
# E2E_SERVER, E2E_USERNAME and E2E_PASSWORD (a user of its own for this, not an admin).
#
# GitHub's Linux runners have KVM: it only has to be opened to the runner's user.
on:
  push:
    branches: [main]
  pull_request:
  # Alone, on the APK of an earlier run (artifacts last a day), to try the flows without a build:
  #   gh workflow run e2e.yml -f run_id=<run>
  workflow_dispatch:
    inputs:
      run_id:
        description: The run whose `android-apk` artifact is used.
        type: string
        required: true

# Reading the artifact of another run (the manual start), and cancelling the run when a job
# fails: `actions: write`.
permissions:
  actions: write
  contents: read

jobs:
  # Pushed or a pull request: the APK first (the nightly hands its own over).
  build:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  e2e:
    needs: build
    # Without the build (called, or by hand) too.
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TV 1/2
            kind: tv
            shard: 1/2
            image: system-images;android-36;android-tv;x86_64
          - name: TV 2/2
            kind: tv
            shard: 2/2
            image: system-images;android-36;android-tv;x86_64
          - name: Phone
            kind: phone
            shard: ""
            image: system-images;android-36;google_apis;x86_64
    env:
      MAESTRO_VERSION: 2.12.1
      E2E_KIND: ${{ matrix.kind }}
      E2E_SHARD: ${{ matrix.shard }}
      AVD_IMAGE: ${{ matrix.image }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Open KVM to the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      # Called by the nightly: the artifact of this very run.
      - name: Download the APK
        if: ${{ inputs.run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: build

      # Started by hand: the artifact of the run that was named.
      - name: Download the APK of the run that was named
        if: ${{ inputs.run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: build
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The emulator's system image (sdkmanager's package, as a path), kept between runs.
      - name: Where the system image goes
        id: image
        run: echo "path=/usr/local/lib/android/sdk/${AVD_IMAGE//;//}" >> "$GITHUB_OUTPUT"

      - name: Cache the system image
        uses: actions/cache@v4
        with:
          path: ${{ steps.image.outputs.path }}
          key: android-image-${{ matrix.kind }}-${{ env.AVD_IMAGE }}

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator ${{ env.AVD_IMAGE }}

      - name: Install Maestro
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.maestro-cli"
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -oq "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-cli"
          echo "MAESTRO_HOME=$HOME/.maestro-cli/maestro" >> "$GITHUB_ENV"

      - name: Start the emulator
        env:
          EMULATOR_LOG: ${{ runner.temp }}/emulator.log
        run: |
          e2e/emulator.sh start
          # The keyboard that comes up for a text field would cover the page.
          adb shell settings put secure show_ime_with_hard_keyboard 0 || true

      - name: Install the app
        run: adb install -r -g build/remux.apk

      - name: Run the flows
        env:
          # The emulator is started again, should it go away.
          E2E_RESTART_EMULATOR: "1"
          EMULATOR_LOG: ${{ runner.temp }}/emulator.log
          REMUX_TEST_SERVER: ${{ secrets.E2E_SERVER }}
          REMUX_TEST_USERNAME: ${{ secrets.E2E_USERNAME }}
          REMUX_TEST_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        # The emulator now and then does not answer adb for a few seconds: run.sh runs a flow again
        # for that, and when the whole run fails it is done once more. A flow that really fails
        # fails twice.
        run: |
          e2e/run.sh || { echo "-- the flows are run once more"; e2e/run.sh; }

      # The screenshots and what the screen looked like at each step, for a flow that failed.
      - name: Keep the output of Maestro
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-maestro-${{ matrix.kind }}-${{ strategy.job-index }}
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 7

      # A job that fails stops the rest of the run: its result is known, and the others would only
      # take runners (and the nightly's release waits on all of them).
      - name: Stop the rest of the run
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

      - name: Clean up
        if: ${{ always() }}
        run: e2e/emulator.sh stop

  # The web app in a browser, as a user: against the same test server. Needs no APK.
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up NSH
        uses: ./.github/actions/setup-nsh
        with:
          targets: wasm32-unknown-unknown
          # Not the web build's: `nsh test` builds other things (a host for the browser too).
          cache-key: web-test

      # As in build-web.yml: a clang for WebAssembly (zstd) and the wasm-bindgen CLI the crate pins.
      - name: Install clang and the wasm-bindgen CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          {
            echo "CC_wasm32_unknown_unknown=clang"
            echo "AR_wasm32_unknown_unknown=llvm-ar"
          } >> "$GITHUB_ENV"

      # The test engine has no environment: the server and the user go in a file of their own.
      - name: Write the test server
        env:
          E2E_SERVER: ${{ secrets.E2E_SERVER }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          jq -rn '"export const server = \(env.E2E_SERVER | @json), username = \(env.E2E_USERNAME | @json), password = \(env.E2E_PASSWORD | @json);"' > tests/test-server.ts

      - name: Run the web tests
        run: nsh test tests/web.test.tsx --target web --junit web-results.xml

      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web
          path: |
            web-results.xml
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # A job that fails stops the rest of the run: its result is known, and the others would only
      # take runners (and the nightly's release waits on all of them).
      - name: Stop the rest of the run
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"
